server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 8k;
    client_body_timeout 5s;
    include /etc/nginx/manicule-errors.conf;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        proxy_send_timeout 8s;
    }

    location /actuator/health {
        proxy_pass http://api:8080;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8081;
    server_name _;
    server_tokens off;
    client_max_body_size 8k;
    client_body_timeout 5s;
    include /etc/nginx/manicule-errors.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;

    location / {
        proxy_pass http://api:8080;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        proxy_send_timeout 8s;
    }
}
