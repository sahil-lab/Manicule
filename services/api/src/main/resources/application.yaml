spring:
  application:
    name: manicule-api
  config:
    import: configtree:/run/secrets/
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/manicule}
    username: manicule
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 3000
      validation-timeout: 2000
  flyway:
    clean-disabled: true
    validate-on-migrate: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    mapper:
      allow-coercion-of-scalars: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  max-http-request-header-size: 8KB
  tomcat:
    connection-timeout: 5s
    max-connections: 128
    accept-count: 32
    threads:
      max: 24
      min-spare: 2

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: ecs
